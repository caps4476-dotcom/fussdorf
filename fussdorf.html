<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Siedlertal</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2a1a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2b2418;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;top:6px;left:6px;right:6px;display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:5}
#chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:rgba(255,248,232,.95);border-radius:10px;padding:3px 7px;display:flex;align-items:baseline;gap:4px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.chip b{font-variant-numeric:tabular-nums}
.chip small{font-size:10px;color:#4c7a2a}
.chip small.neg{color:#c0392b}
.chip.full b{color:#c27c0e}
.chip.warn{background:#ffd9cf}
#chips .click{pointer-events:auto;background:#ffe7a8;border:1px solid #c9a46a}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pick>div{background:#fff;border:2px solid #eadcbc;border-radius:12px;padding:6px 4px;text-align:center;font-size:13px;line-height:1.2}
.pick .av{font-size:28px;line-height:1.1}.pick small{display:block;color:#6b5d45;font-size:11px}
#goal{pointer-events:auto;align-self:flex-start;max-width:330px;background:rgba(48,36,22,.88);color:#fbefd2;border-radius:10px;padding:5px 9px;font-size:12.5px;line-height:1.3}
#goal b{color:#ffd36b}
#goal.min span{display:none}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:rgba(40,30,20,.94);z-index:8}
#nav button{flex:1;min-width:0;border:0;border-radius:12px;padding:6px 1px;background:#f3e6c8;font-size:11px;font-weight:600;color:#3a2c1a;display:flex;flex-direction:column;align-items:center;gap:1px}
#nav button span{font-size:20px;line-height:1.1}
#sheet{position:fixed;left:0;right:0;bottom:var(--navh,64px);max-height:58vh;overflow-y:auto;background:#fbf4e4;border-radius:16px 16px 0 0;padding:12px 14px 16px;transform:translateY(130%);transition:transform .22s;z-index:7;box-shadow:0 -4px 16px rgba(0,0,0,.35)}
#sheet.open{transform:none}
#sheet h3{margin:0 34px 6px 0;font-size:18px}
#sheet p{margin:5px 0;font-size:14px}
#sheet .desc{color:#6b5d45;font-size:13px}
#sheet .note{color:#8a6a2a;font-size:13px}
.lv{font-size:13px;background:#e9dcbd;border-radius:8px;padding:2px 7px;margin-left:4px;vertical-align:middle}
#x{position:absolute;right:10px;top:8px;border:0;background:#e9dcbd;border-radius:50%;width:32px;height:32px;font-size:16px}
.item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:#fff;margin-bottom:6px;border:1px solid #eadcbc}
.item .ic{font-size:28px;width:40px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item small{display:block;color:#6b5d45;font-size:12px}
.item.locked{opacity:.55}
.item.done{background:#eef6e4}
.cost{font-size:13px;margin-top:2px}
.cost span,.c span{margin-right:7px;white-space:nowrap}
.miss{color:#c0392b;font-weight:700}
button.big{display:block;width:100%;border:0;border-radius:12px;padding:10px;background:#4f8a2b;color:#fff;font-size:15px;font-weight:700;margin-top:8px}
button.big small{font-weight:500;color:#eaf5df}
button.big .miss{color:#ffd0c4}
button.big:disabled{background:#a9a28f}
button.danger{display:block;width:100%;border:0;border-radius:12px;padding:9px;background:#efdccb;color:#8a2a1a;font-size:14px;font-weight:600;margin-top:8px}
button.sm{border:0;border-radius:10px;padding:8px 12px;background:#4f8a2b;color:#fff;font-weight:700;font-size:13px}
button.sm:disabled{background:#a9a28f}
.workers{display:flex;align-items:center;gap:8px;margin:8px 0}
.workers span{flex:1;font-weight:600;font-size:15px}
.workers button{width:46px;height:40px;border-radius:10px;border:0;background:#e9dcbd;font-size:22px;font-weight:700}
.row{display:flex;gap:8px}
.row button{flex:1}

.bar{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}
.bar span{width:92px}.bar div{flex:1;height:9px;background:#e9dcbd;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#4f8a2b;border-radius:5px}.bar b{width:38px;text-align:right}
.thought{background:#fff;border:1px solid #eadcbc;border-radius:12px;padding:8px 10px;font-style:italic;margin:8px 0}
textarea{width:100%;height:70px;font-size:11px;border-radius:8px;border:1px solid #d8c9a6;padding:6px;user-select:text;-webkit-user-select:text}
#banner{position:fixed;left:8px;right:8px;bottom:calc(var(--navh,64px) + 8px);background:#fbf4e4;border-radius:12px;padding:8px 10px;display:none;align-items:center;gap:8px;z-index:6;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#banner.on{display:flex}
#banner .t{flex:1;font-size:13.5px;line-height:1.3}
#banner button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px}
#bOk{background:#4f8a2b;color:#fff}
#bOk:disabled{background:#a9a28f}
#bNo{background:#e9dcbd}
#toast{position:fixed;left:50%;bottom:calc(var(--navh,64px) + 70px);transform:translateX(-50%);background:rgba(30,24,16,.92);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:30;padding:20px 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
#modal .box{margin:auto 0}
#modal.on{display:flex}
#modal .box{background:#fbf4e4;border-radius:16px;padding:18px;max-width:340px;width:100%}
#modal h3{margin:0 0 8px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top"><div id="chips"></div><div id="goal"></div></div>
<div id="banner"><div class="t" id="bText"></div><button id="bOk" data-act="build">✔ Bauen</button><button id="bNo" data-act="cancel">✖</button></div>
<div id="sheet"><button id="x" data-act="close">✕</button><div id="sc"></div></div>
<div id="nav">
  <button data-act="nav:build"><span>🔨</span>Bauen</button>
  <button data-act="nav:research"><span>🔬</span>Forschung</button>
  <button data-act="nav:village"><span>👥</span>Dorf</button>
  <button data-act="nav:story" style="position:relative"><span>📖</span>Geschichte<i id="sbadge" style="display:none;position:absolute;top:3px;right:8px;width:10px;height:10px;border-radius:50%;background:#e0452b"></i></button>
  <button data-act="nav:menu"><span>☰</span>Menü</button>
</div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script>
'use strict';
// ======================= KONSTANTEN =======================

const THEME_D={start:'Euer Startgebiet.',wald:'Viele Bäume – ideal für Holzfäller.',berg:'Felsen und wertvolle Erzadern für Minen.',see:'Ein See mit Uferwald.',wiese:'Viel freie Baufläche.'};
const B={
  camp:{n:'Lagerfeuer',i:'🔥',roof:'#8a5530',house:2,store:true,fixed:true,desc:'Euer Startpunkt: Schlafplatz für 2 und Abgabestelle für Ressourcen.'},
  house:{n:'Haus',i:'🏠',roof:'#c0503a',cost:{wood:12,stone:4},house:2,store:true,desc:'Wohnraum für 2 Bewohner pro Stufe. Auch Abgabestelle.'},
  gatherer:{n:'Sammlerhütte',i:'🧺',roof:'#c79a3a',cost:{wood:8},slots:2,prod:{food:0.15},season:1,desc:'Sammelt Beeren und Pilze – Nahrung für dein Dorf.'},
  woodcutter:{n:'Holzfäller',i:'🪓',roof:'#6b8e23',cost:{wood:10},slots:2,prod:{wood:0.15},near:TR,r:3,desc:'Fällt Bäume in der Nähe (Radius 3). Mehr Bäume = mehr Effizienz.'},
  quarry:{n:'Steinbruch',i:'⛰️',roof:'#8a8f96',cost:{wood:15},slots:2,prod:{stone:0.1},near:RK,r:3,desc:'Baut Felsen in der Nähe ab (Radius 3).'},
  scholar:{n:'Gelehrtenhaus',i:'📜',roof:'#5a6fd0',cost:{wood:20,stone:10},slots:2,prod:{research:0.08},desc:'Erzeugt Forschungspunkte für neue Gebäude.'},
  storage:{n:'Lagerhaus',i:'📦',roof:'#8b5a2b',cost:{wood:30,stone:10},store:true,cap:150,req:'storage',desc:'Klein (1 Feld): +150 Lagerplatz pro Stufe. Abgabestelle für Sammler.'},
  storage2:{n:'Großes Lagerhaus',i:'📦📦',roof:'#7a4a24',fw:2,fh:2,cost:{wood:50,stone:40,planks:30},store:true,cap:550,req:'sawmill',desc:'Mittel (2×2 Felder): +550 Lagerplatz pro Stufe – fast 4× so viel wie das kleine. Abgabestelle für Sammler.'},
  storage3:{n:'Lagerhalle',i:'🏭',roof:'#5a5f6a',fw:3,fh:2,cost:{stone:90,planks:70,iron:20,tools:5},store:true,cap:1100,req:'smelting',desc:'Groß (3×2 Felder): +1100 Lagerplatz pro Stufe. Die platzsparendste Lösung für große Dörfer. Abgabestelle für Sammler.'},
  sawmill:{n:'Sägewerk',i:'🪚',roof:'#b5651d',cost:{wood:30,stone:15},slots:2,conv:{in:{wood:0.15},out:{planks:0.1}},req:'sawmill',desc:'Verarbeitet Holz zu Brettern.'},
  farm:{n:'Bauernhof',i:'🌾',roof:'#d4b03a',cost:{wood:20,planks:10},slots:3,prod:{grain:0.2,food:0.08},season:1,req:'farm',desc:'Baut Getreide an (für die Mühle) und liefert etwas Nahrung.'},
  mine:{n:'Mine',i:'⛏️',roof:'#4a4a4a',cost:{planks:20,stone:20},slots:2,prod:{ore:0.06},near:OR,r:2,req:'mining',desc:'Fördert Erz. Braucht eine Erzader im Radius 2.'},
  smelter:{n:'Schmelze',i:'🏭',roof:'#7a2e2e',cost:{stone:40,planks:20},slots:2,conv:{in:{ore:0.1},out:{iron:0.05}},req:'smelting',desc:'Schmilzt Erz zu Eisen.'},
  fisher:{n:'Fischerhütte',i:'🎣',roof:'#3f7f9a',cost:{wood:15,stone:5},slots:2,prod:{food:0.25},season:1,near:WA,r:2,req:'fishing',desc:'Fängt Fische. Braucht Wasser im Radius 2 (Seenland).'},
  mill:{n:'Mühle',i:'🌬️',roof:'#c9b48a',cost:{wood:30,planks:15,stone:10},slots:2,conv:{in:{grain:0.2},out:{flour:0.12}},req:'milling',desc:'Mahlt Getreide zu Mehl.'},
  bakery:{n:'Bäckerei',i:'🥖',roof:'#b5773a',cost:{stone:25,planks:20},slots:2,conv:{in:{flour:0.12},out:{food:0.5}},track:'bread',req:'milling',desc:'Backt aus Mehl Brot – sehr viel Nahrung.'},
  toolsmith:{n:'Werkzeugschmied',i:'⚒️',roof:'#5a4a6a',cost:{stone:40,planks:30,iron:10,gold:20},slots:2,conv:{in:{iron:0.05,planks:0.05},out:{tools:0.03}},req:'smithing',desc:'Fertigt aus Eisen und Brettern Werkzeuge.'},
  flowerbed:{n:'Blumenbeet',i:'🌷',roof:'#7fb35a',cost:{wood:5},joy:1,desc:'Schmuck fürs Dorf: +1 Freude pro Stufe.'},
  fountain:{n:'Brunnen',i:'⛲',roof:'#9fb8c8',cost:{stone:20,wood:5},joy:3,desc:'Treffpunkt der Bewohner: +3 Freude pro Stufe.'},
  market:{n:'Marktplatz',i:'🎪',roof:'#c9a46a',cost:{planks:20,stone:20,gold:30},joy:6,req:'market',desc:'Buntes Treiben: +6 Freude pro Stufe.'},
  school:{n:'Schule',i:'🏫',roof:'#b85a3a',cost:{wood:40,stone:30,planks:20,gold:40},req:'schooling',desc:'Kinder lernen hier (6 Plätze pro Stufe). Wer mind. die halbe Kindheit zur Schule geht, wird erwachsen „gebildet“: +15 % Arbeitsleistung.'},
  uni:{n:'Universität',i:'🎓',roof:'#6a3a8a',cost:{stone:80,planks:50,iron:20,gold:150},slots:2,req:'university',desc:'Gebildete studieren hier 1 Tag und werden „Gelehrte“: +30 % Leistung, im Gelehrtenhaus doppelt so viel Forschung. Gelehrte braucht man für moderne Forschung.'},
  power:{n:'Kraftwerk',i:'⚡',roof:'#4a5a7a',cost:{stone:60,planks:40,iron:20,gold:80},slots:2,conv:{in:{wood:0.3},out:{}},req:'electricity',desc:'Verbrennt Holz zu Strom. Versorgt 8 Betriebe pro Stufe mit +25 % Produktion. Nachts leuchten Laternen an den Wegen.'},
  garage:{n:'Fuhrhof',i:'🛻',roof:'#5a6a4a',cost:{planks:50,iron:30,tools:10,gold:150},slots:2,conv:{in:{tools:0.005},out:{}},req:'vehicles',desc:'Karren und Fuhrwerke: Alle Bewohner laufen 40 % schneller und tragen beim Sammeln 2 mehr. Verbraucht etwas Werkzeug.'},
  bank:{n:'Bank',i:'🏦',roof:'#6a7a8a',cost:{stone:40,planks:30,gold:50},req:'banking',desc:'Sparkonto, Festgeld und Kredite. Jede Stufe erhöht die maximale Anlagesumme.'},
  stall:{n:'Händlerstand',i:'🏪',roof:'#d08a3a',cost:{wood:20,stone:10},desc:'Hier verkaufst du Waren für Gold und kaufst ein. Jede Stufe: +8 % bessere Preise. Lockt den fahrenden Händler an.'},
  tavern:{n:'Taverne',i:'🍺',roof:'#8a4a2a',cost:{wood:30,stone:15},joy:4,req:'s_tavern',lockT:'🔒 Geschichte: Kapitel 1',desc:'Hildegards Taverne: +4 Freude pro Stufe. Hier werden Geschichten erzählt.'},
  diamondmine:{n:'Diamantmine',i:'💎',roof:'#3a6a8a',cost:{planks:30,stone:40,iron:15,tools:8,gold:80},slots:2,prod:{diamond:.0011},rare:1,near:OR,r:2,req:'gemcraft',desc:'Gräbt tief nach Diamanten – Funde sind selten! Braucht eine Erzader im Radius 2 (Erzberge). Diamanten 💎 beschleunigen Bauten und Forschung, kaufen Elite-Technik und bringen auf dem Markt viel Gold.'},
  herbs:{n:'Kräuterhütte',i:'🌿',roof:'#4a7a3a',cost:{wood:30,stone:10},slots:1,req:'herbs',desc:'Die Kräuterkundige pflegt Kranke zu Hause – sie werden deutlich schneller gesund.'},
  hospital:{n:'Krankenhaus',i:'🏥',roof:'#c9d3db',fw:2,fh:2,cost:{stone:80,planks:60,iron:15,tools:5,gold:100},slots:3,req:'medicine',desc:'Großes Krankenhaus (2×2): 4 Betten pro Stufe. Mit Ärzten werden Kranke dort 6× schneller gesund.'},
  hunter:{n:'Jägerhütte',i:'🏹',roof:'#5a4a2a',cost:{wood:25,stone:5},slots:2,prod:{meat:.05},near:TR,r:2,wild:1,req:'hunting',desc:'Jäger erlegen Wild im Wald (Bäume im Radius 2) und liefern 🥩 Fleisch. Achtung: Zu viel Jagd dezimiert den Wildbestand – dann sinkt die Beute.'},

  butcher:{n:'Metzgerei',i:'🔪',roof:'#a33a3a',cost:{stone:30,planks:20},slots:2,conv:{in:{cattle:.04},out:{meat:.3}},req:'husbandry',desc:'Der Metzger verarbeitet 🐄 Vieh zu 🥩 Fleisch.'},
  tradepost:{n:'Handelskontor',i:'🐴',roof:'#7a5a3a',fw:2,fh:2,cost:{planks:50,stone:40,gold:120},req:'market',desc:'Großes Kontor (2×2): Schickt Karawanen zu Nachbardörfern. Pro Stufe 1 Handelsroute und +30 Ladung pro Fahrt. Tausche Überschuss gegen Gold oder Waren, die du brauchst.'},
  coalmine:{n:'Kohlezeche',i:'⚫',roof:'#3a3a3a',cost:{planks:40,stone:40,iron:15},slots:3,prod:{coal:.18},near:OR,r:2,req:'coalmining',desc:'🏭 Industriezeit: Fördert ⚫ Kohle aus dem Berg (Erzader im Radius 2).'},
  factory:{n:'Fabrik',i:'🏭',roof:'#7a3a2a',fw:2,fh:2,cost:{planks:80,stone:100,iron:40,tools:10},slots:4,conv:{in:{iron:.06,coal:.08},out:{tools:.05}},req:'industry',desc:'🏭 Industriezeit (2×2): Stellt mit Eisen und Kohle in großen Mengen 🔧 Werkzeug her.'},
  station:{n:'Bahnhof',i:'🚉',roof:'#6a4a3a',fw:3,fh:1,cost:{planks:100,stone:120,iron:60,gold:300},req:'railway',desc:'🏭 Industriezeit (3×1): Die Eisenbahn bringt deine Handelskarawanen doppelt so schnell ans Ziel.'},
  apartment:{n:'Wohnblock',i:'🏢',roof:'#8a8f99',fw:2,fh:2,house:1,cost:{stone:150,planks:80,iron:40,tools:10},req:'masshousing',desc:'🏙️ Moderne (2×2): Viel Wohnraum auf wenig Fläche – 24 Wohnplätze pro Stufe.'},
  park:{n:'Stadtpark',i:'🌳',roof:'#4f8a2b',fw:2,fh:2,cost:{wood:60,stone:40,gold:150},req:'urbanism',desc:'🏙️ Moderne (2×2): Grüne Oase mit Teich und Bänken – viele Plätze für 🌳 Natur & Ruhe.'},

  supermarket:{n:'Supermarkt',i:'🛒',roof:'#c0392b',fw:2,fh:2,cost:{stone:100,planks:60,iron:30,gold:250},req:'retail',desc:'🏙️ Moderne (2×2): Weniger verdirbt – die Bewohner brauchen 15 % weniger Nahrung. Zählt auch als 🍺 Gastronomie.'},
  solar:{n:'Solarpark',i:'☀️',roof:'#2a4a7a',fw:2,fh:2,cost:{iron:80,tools:30,gold:400},req:'solar',desc:'🚀 Zukunft (2×2): Sauberer Strom ohne Brennstoff und ohne Arbeiter – 6 Betriebe pro Stufe (im Winter weniger).'},

function genMap(seed){
  const r=rng(seed), tiles=new Array(W*H).fill(GR);
  const set=(x,y,t)=>{if(inMap(x,y)&&tiles[x+y*W]===GR)tiles[x+y*W]=t};
  const blob=(cx,cy,t,rad,dens)=>{
    for(let y=Math.floor(cy-rad-1);y<=cy+rad+1;y++)for(let x=Math.floor(cx-rad-1);x<=cx+rad+1;x++){
      if(zoneOf(Math.floor(cx),Math.floor(cy))!==zoneOf(x,y))continue;
      const d=Math.hypot(x+.5-cx,y+.5-cy);
      if(d<=rad&&r()<dens*(1-d/(rad+1.5))+0.15)set(x,y,t);
    }};
  const cluster=(zx,zy,t,rad,dens)=>blob(zx*ZS+2+r()*(ZS-4),zy*ZS+2+r()*(ZS-4),t,rad,dens);
  for(let z=0;z<9;z++){
    const zx=z%ZN, zy=Math.floor(z/ZN), th=THEMES[z];
    if(th==='see'){
      const cx=zx*ZS+7,cy=zy*ZS+7;
      for(let y=zy*ZS;y<zy*ZS+ZS;y++)for(let x=zx*ZS;x<zx*ZS+ZS;x++){if(Math.hypot(x+.5-cx,y+.5-cy)+r()*1.3<4.3)tiles[x+y*W]=WA}
      for(let i=0;i<5;i++)cluster(zx,zy,TR,2,.85);
      cluster(zx,zy,RK,1.3,.8);
    }else if(th==='wald'){
      for(let i=0;i<8;i++)cluster(zx,zy,TR,2.5,.95);
      cluster(zx,zy,RK,1.5,.8);
    }else if(th==='berg'){
      for(let i=0;i<5;i++)cluster(zx,zy,RK,1.8,.9);
      for(let i=0;i<3;i++)cluster(zx,zy,OR,1.3,.95);
      for(let i=0;i<2;i++)cluster(zx,zy,TR,1.8,.7);
    }else if(th==='wiese'){
      for(let i=0;i<2;i++)cluster(zx,zy,TR,1.6,.6);
      cluster(zx,zy,RK,1.1,.7);
    }else{ // Start
      const c=ZS+7;
      [[-4.5,-3.5],[4,-4.5],[-5,3.5],[3.5,4.5],[-1,-6]].forEach(o=>blob(c+o[0],c+o[1],TR,2.3,.95));
      [[5.5,0.5],[-2,5.5]].forEach(o=>blob(c+o[0],c+o[1],RK,1.5,.95));
    }
  }
  const c=ZS+7; // Startplatz freiräumen
  for(let y=c-3;y<=c+3;y++)for(let x=c-3;x<=c+3;x++)if(Math.hypot(x-c,y-c)<2.8)tiles[x+y*W]=GR;
  return tiles;
}

      for(const r in PRICE){if(g>=bud)break;if(r==='diamond'||r==='food')continue;const c=cap(r),lim=c*.8;if(!isFinite(c)||S.res[r]<=lim)continue;

const FIRE_RISK={bakery:3,toolsmith:3,smelter:3,sawmill:2,tavern:2,power:2.5,factory:3,coalmine:2,woodcutter:1.5,house:1,storage:1.2,storage2:1.2,storage3:1,farm:1.2,mill:1.5,cinema:1.5,butcher:1.5,hunter:1.2};

function fireCover(b){const cx=b.x+fpW(b.type)/2,cy=b.y+fpH(b.type)/2;let best=null,bd=1e9;for(const s of S.buildings){if(s.type!=='firestation'||isSite(s)||!wcount(s))continue;const d=Math.hypot(s.x+.5-cx,s.y+.5-cy);if(d<=B.firestation.cover+2*(s.level-1)+.5&&d<bd){bd=d;best=s}}return best}
function fireRiskOf(b){let r=FIRE_RISK[b.type]||(B[b.type].slots?1:0);if(!r)return 0;if(b.type==='house'&&b.level>3)r*=Math.max(.3,1-.12*(b.level-3)*(EP()+1));if(EP()>=2)r*=.6;return r}
function fireTick(dt,live){
  const burning=S.buildings.filter(b=>b.fire>0);
  if(live&&S.vill.length>=20){const sf=[1,1.3,1,1.5][seasonIdx()];for(const b of S.buildings){if(b.fire||isSite(b))continue;const r=fireRiskOf(b);if(r&&Math.random()<.000012*r*sf*dt){b.fire=.01;b.fx=0;toast(`🔥 Feuer! ${B[b.type].i} ${B[b.type].n} brennt${fireCover(b)?' – die Feuerwehr rückt aus! 🚒':' – die Bewohner löschen mit Eimern. Eine 🚒 Feuerwache wäre schneller!'}`);S.fires=(S.fires||0)+1}}}
  for(const b of burning){
    b.fire+=dt;const st=fireCover(b),wells=S.buildings.filter(w=>(w.type==='fountain'||w.type==='well')&&!isSite(w)&&Math.hypot(w.x-b.x,w.y-b.y)<5).length;
    let rate=.007+.006*Math.min(3,wells);if(st)rate+=.035*wcount(st)*(1+.3*(st.level-1));
    if(b.ft==null)b.ft=st?st.id:null;
    b.fx+=rate*dt;
    if(b.fx>=1){b.fire=0;b.fx=0;b.ft=null;if(live)toast(`🧯 ${B[b.type].i} ${B[b.type].n} ist gelöscht!${st?' Gut gemacht, Feuerwehr! 🚒':''}`);continue}
    if(b.fire>=30&&Math.random()<.012*dt){const nb=S.buildings.find(o=>o!==b&&!o.fire&&!isSite(o)&&fireRiskOf(o)&&Math.abs(o.x-b.x)<=fpW(b.type)&&Math.abs(o.y-b.y)<=fpH(b.type));if(nb){nb.fire=.01;nb.fx=0;if(live)toast(`🔥 Das Feuer greift auf ${B[nb.type].i} ${B[nb.type].n} über!`)}}
    if(b.fire>=FIRE_DMG){b.fire=0;b.fx=0;b.ft=null;S.burnt=(S.burnt||0)+1;
      if(b.level>1){b.level--;if(live)toast(`💥 ${B[b.type].i} ${B[b.type].n} ist abgebrannt und verliert eine Stufe (jetzt Stufe ${b.level}).`)}
      else{const bt=buildTime(B[b.type].cost);b.cs=bt*.5;b.ct=bt*.5;b.qs=Date.now();if(live)toast(`💥 ${B[b.type].i} ${B[b.type].n} ist abgebrannt und muss wieder aufgebaut werden.`)}}
  }
}

const SICK_T=300;
const sickN=()=>S.vill.reduce((n,v)=>n+(v.sick>0?1:0),0);
function sickRisk(){return .00006*(1+3*dirtLvl()+(S.res.food<=.001?3:0)+(seasonIdx()===3?1.2:0))*(S.res.meat>1?.85:1)}
function hospBeds(b){const w=wcount(b);return w?Math.round(4*b.level*Math.min(1,w/2)):0}
function healthTick(dt,live){
  const hos=S.buildings.filter(b=>b.type==='hospital'&&!isSite(b));
  let care=0;for(const b of S.buildings)if(b.type==='herbs'&&!isSite(b))care+=wcount(b)*b.level;
  const occ={};for(const v of S.vill)if(v.sick>0&&v.hosp)occ[v.hosp]=(occ[v.hosp]||0)+1;
  const home=S.vill.filter(v=>v.sick>0&&!v.hosp).length,hf=1+Math.min(1.5,care*3/Math.max(1,home));
  for(const v of S.vill){
    if(!(v.sick>0)){if(!v.kid&&!(v.job&&v.job.t==='x')&&Math.random()<sickRisk()*dt){v.sick=SICK_T*(.7+Math.random()*.6);v.hosp=null;v.inH=false;v.tx=null;v.role=null;if(v.job&&v.job.t==='h')v.job=null;S.sickTot=(S.sickTot||0)+1}continue}
    if(v.hosp&&!hos.some(b=>b.id===v.hosp)){v.hosp=null;v.inH=false}
    if(!v.hosp)for(const b of hos)if((occ[b.id]||0)<hospBeds(b)){v.hosp=b.id;v.inH=false;occ[b.id]=(occ[b.id]||0)+1;break}
    const rate=v.hosp?(live&&!v.inH?1:6):hf;
    v.sick-=dt*rate;
    if(v.sick<=0){v.sick=0;v.hosp=null;v.inH=false;v.asleep=false;v.tx=null}
  }
  const n=sickN();
  if(live&&n>=3&&!S.flags.sw&&!hos.length){S.flags.sw=1;toast(`🤒 ${n} Bewohner sind krank und können nicht arbeiten! ${S.tech.herbs?'Baue eine 🌿 Kräuterhütte'+(S.tech.medicine?' oder ein 🏥 Krankenhaus':''):'Erforsche 🌿 Kräuterkunde'}.`)}
  if(n===0)S.flags.sw=0;
}

const TRASH_P=.012,DUMP_C=.5,SWEEP_C=.1,DUMP_CAP=400,DUMP_ROT=25/60;

let TR_COL=0,TR_SW=0,TR_ROT=0;
function trashTick(dt,live){
  if(S.dirt==null)S.dirt=0;
  S.dirt+=trashGen()*dt;
  const room=()=>Math.max(0,cap('trash')-S.res.trash);
  let col=0;const hf=S.res.food<=0.001?.5:1;
  for(const b of S.buildings){if(b.type!=='dump'||isSite(b))continue;const w=wcount(b);if(!w)continue;col+=DUMP_C*w*(1+.5*(b.level-1))*hf}
  const sw=S.vill.filter(v=>v.role==='s').length*SWEEP_C;
  TR_COL=col;TR_SW=sw;
  if(S.res.trash>0){let rot=0;for(const b of S.buildings)if(b.type==='dump'&&!isSite(b)&&wcount(b))rot+=DUMP_ROT*b.level;TR_ROT=rot;S.res.trash=Math.max(0,S.res.trash-rot*dt)}else TR_ROT=0;
  if(S.res.trash>cap('trash'))S.res.trash=cap('trash');
  const tot=Math.min(S.dirt,(col+sw)*dt,room());
  if(tot>0){S.dirt-=tot;S.res.trash+=tot;S.made.trash=(S.made.trash||0)+tot}
  const dl=dirtLvl();
  if(live&&dl>.5&&!S.flags.dw){S.flags.dw=1;toast(`🗑️ Überall liegt Müll herum! Baue einen 🚛 Müllplatz${has('dump')?' oder stelle mehr Müllmänner ein':''}.`)}
  if(dl<.3)S.flags.dw=0;
}

// ======================= WIRTSCHAFT =======================
function workerCounts(){const c={};for(const v of S.vill)if(v.job&&v.job.t==='b'&&!(v.sick>0))c[v.job.id]=(c[v.job.id]||0)+1;return c}
const wcount=b=>S.vill.reduce((n,v)=>n+(v.job&&v.job.t==='b'&&v.job.id===b.id&&!(v.sick>0)?1:0),0);
const slots=b=>B[b.type].slots?B[b.type].slots+(b.level-1):0;
function countNear(x,y,t,r){let n=0;for(let yy=y-r;yy<=y+r;yy++)for(let xx=x-r;xx<=x+r;xx++){if(inMap(xx,yy)&&S.tiles[xx+yy*W]===t&&Math.hypot(xx-x,yy-y)<=r+.5)n++}return n}
function effAt(type,x,y){const d=B[type];if(d.near==null)return 1;const n=countNear(x,y,d.near,d.r);return n===0?0:Math.min(1,.4+n*.15)}
const eff=b=>effAt(b.type,b.x,b.y);
function mult(b,r){let m=1+.5*(b.level-1);if(S.tech.tools1&&(r==='wood'||r==='stone'))m*=1.2;if(S.tech.tools2)m*=1.3;if(S.tech.tools3)m*=1.25;if(S.tech.diamondtools)m*=1.2;if(S.tech.gemcraft2){if(r==='diamond')m*=1.5;if(r==='stone'||r==='ore')m*=1.15}if(hasRoad(b))m*=1.1;if(PWR&&B[b.type].slots&&!['power','uni','garage'].includes(b.type))m*=1+.25*PWR;if(S.story&&S.story.bless)m*=1.15;const hc=S.hero&&S.hero.c;if(hc==='thordis'&&r==='wood')m*=1.1;if(hc==='elmiran'&&r==='food')m*=1.15;if(hc==='zara'&&r==='research')m*=1.25;if(S.tech.agri2&&(r==='food'||r==='grain'))m*=1.25;if(S.tech.mining2&&(r==='stone'||r==='ore'))m*=1.25;if(hc==='serafina'&&(r==='iron'||r==='planks'||b.type==='smelter'||b.type==='sawmill'))m*=1.15;m*=1+.1*(S.epoch||0);m*=1+ROBO;if(inDist(b))m*=1.15;m*=.8+.4*happy().total;if(B[b.type].season&&(r==='food'||r==='grain'))m*=SEAS[seasonIdx()].food;return m}
const hasRoad=b=>{const w=fpW(b.type),h=fpH(b.type);for(let y=b.y-1;y<=b.y+h;y++)for(let x=b.x-1;x<=b.x+w;x++){const ins=x>=b.x&&x<b.x+w&&y>=b.y&&y<b.y+h,cor=(x<b.x||x>=b.x+w)&&(y<b.y||y>=b.y+h);if(ins||cor||!inMap(x,y))continue;if(S.road[x+y*W])return true}return false};
function cap(r){if(r==='research'||r==='gold'||r==='diamond')return Infinity;if(r==='trash'){let c=50;for(const b of S.buildings)if(b.type==='dump'&&!isSite(b))c+=DUMP_CAP*b.level;return c}let c=100;for(const b of S.buildings)if(B[b.type].cap&&!isSite(b))c+=B[b.type].cap*b.level;return c}
function popCap(){let c=0;for(const b of S.buildings)c+=beds(b);return c}
function econ(dt,apply){
  const d={},add=(r,a)=>d[r]=(d[r]||0)+a;
  const cnt=workerCounts(), hf=S.res.food<=0.001?.5:1, pw={};
  for(const v of S.vill)if(v.job&&v.job.t==='b'&&!(v.sick>0)){const bb=byId(v.job.id);pw[v.job.id]=(pw[v.job.id]||0)+1+(v.edu===2?(bb&&bb.type==='scholar'?1:.3):v.edu===1?.15:0)}
  {let sup=0,dem=0;for(const b of S.buildings){if(isSite(b))continue;const dd=B[b.type];if(b.type==='power'){const w=cnt[b.id]||0;if(w&&(S.res.wood>1||(S.tech.incinerate&&S.res.trash>1)||(S.tech.steam&&S.res.coal>1)))sup+=8*b.level*Math.min(1,w/slots(b))*(S.tech.steam&&S.res.coal>1?1.5:1)}else if(b.type==='solar')sup+=6*b.level*[.9,1.2,.8,.4][seasonIdx()];else if(dd.slots&&b.type!=='uni'&&b.type!=='garage'&&b.type!=='robots')dem++}
   PWR=dem?Math.min(1,sup/dem):0;PWR_S=sup;PWR_D=dem;
   VEH=S.buildings.some(b=>b.type==='garage'&&!isSite(b)&&(cnt[b.id]||0)>0&&S.res.tools>.5)}
  for(const b of S.buildings){
    const def=B[b.type],w=cnt[b.id]||0;if(!w||isSite(b)||b.fire)continue;
    const e=eff(b);if(!e)continue;
    const f=(pw[b.id]||w)*e*hf*(def.wild?wildF():1);

    else if(def.prod)for(const r in def.prod){const a=def.prod[r]*mult(b,r)*f*dt;add(r,a);if(def.wild&&apply)S.wild=Math.max(0,S.wild-a*1.2)}
    if(def.conv){
      const m=mult(b,null);let ratio=1;const cin=b.type==='power'&&S.tech.incinerate&&S.res.trash+(d.trash||0)>1?{trash:.4}:b.type==='power'&&S.tech.steam&&S.res.coal+(d.coal||0)>1?{coal:.15}:def.conv.in;
      for(const r in cin){const need=cin[r]*m*f*dt,have=Math.max(0,S.res[r]+(d[r]||0));ratio=Math.min(ratio,need>0?have/need:1)}
      for(const r in cin)add(r,-cin[r]*m*f*dt*ratio);

      if(apply&&def.track)S.made[def.track]=(S.made[def.track]||0)+ratio*f*dt;
    }
  }
  {const need=S.vill.length*FOOD_PER*dt*(has('supermarket')?.85:1),mUse=Math.min(need*.25/2,Math.max(0,S.res.meat+(d.meat||0)));add('meat',-mUse);add('food',-(need-mUse*2))}
  if(!apply){const room=Math.max(0,cap('trash')-S.res.trash),c=(S.dirt>1?Math.min(TR_COL+TR_SW,trashGen()+S.dirt/dt,room/dt+TR_ROT):Math.min(TR_COL+TR_SW,trashGen())),r=Math.min(TR_ROT,c+S.res.trash/dt);add('trash',(c-r)*dt)}
  {const tg=taxPerDay();if(tg){add('gold',tg/DAY*dt);if(apply)gLog('🏛️ Steuern',tg/DAY*dt)}}
  if(apply)for(const r in d){if(d[r]>0){S.made[r]=(S.made[r]||0)+d[r];if(r!=='research')S.xp+=d[r]*.1}S.res[r]=Math.max(0,Math.min(cap(r),S.res[r]+d[r]))}

}

const PRICE={wood:.5,stone:.6,food:.4,grain:.8,flour:1.5,planks:1.6,ore:2,iron:5,tools:12,diamond:90,meat:2.5,cattle:6,coal:1.2};
const pDrop=(r,n)=>r==='diamond'?n*.04:n*PRICE[r]/400;
function tradeBonus(){const st=S.buildings.filter(b=>b.type==='stall'&&!isSite(b));if(!st.length)return 0;let m=1+.08*(Math.max(...st.map(b=>b.level))-1);if(S.tech.market)m*=1.1;if(S.hero&&S.hero.c==='zara')m*=1.15;return m}
const sellP=r=>PRICE[r]*S.mkt[r].f*tradeBonus();
const buyP=r=>PRICE[r]*S.mkt[r].f*2.2/Math.max(1,tradeBonus());
function earn(g){addRes('gold',g);gainXP(g*.2)}
function doSell(r,n){n=Math.min(n,Math.floor(S.res[r]));if(n<=0||!tradeBonus())return;const m=S.mkt[r],f0=m.f,f1=Math.max(.4,f0-pDrop(r,n)),g=PRICE[r]*(f0+f1)/2*n*tradeBonus();m.f=f1;S.res[r]-=n;GSRC='🏪 Markt-Verkauf';earn(g);GSRC=null;toast(`💰 ${n} ${RES[r].n} verkauft: +${f1_(g)} Gold`)}
function doBuy(r,n){if(!tradeBonus())return;n=Math.min(n,Math.floor(cap(r)-S.res[r]));if(n<=0){toast('Lager ist voll');return}const g=buyP(r)*n;if(S.res.gold<g){toast('Nicht genug Gold');return}S.res.gold-=g;addRes(r,n);S.mkt[r].f=Math.min(1.8,S.mkt[r].f+pDrop(r,n));toast(`🛒 ${n} ${RES[r].n} gekauft: −${f1_(g)} Gold`)}
const f1_=n=>f1(n);
function marketTick(dt,live){
  for(const r in S.mkt){const m=S.mkt[r];m.f+=Math.sign(m.t-m.f)*Math.min(Math.abs(m.t-m.f),.0005*dt)}
  const d=dayNo();
  if(d!==S.lastDay){S.lastDay=d;for(const r in S.mkt){const m=S.mkt[r];m.t=Math.max(.7,Math.min(1.4,m.t+(Math.random()-.5)*.3))}
    if(live&&!S.trader&&has('stall')&&Math.random()<.45){spawnTrader();toast('🧳 Ein fahrender Händler ist am Lagerfeuer angekommen!')}}

  const rr=pick(['planks','iron','tools','ore']),n=5+Math.floor(Math.random()*10);offers.push({k:'sell',r:rr,n,g:Math.round(n*PRICE[rr]*1.3)});
  offers.push({k:'fp',n:25,g:45});

function heroTick(dt,live){
  const h=S.hero;if(!h)return;
  const site=h.atSite&&byId(h.atSite);
  if(!site||!(site.cs>0)){h.atSite=null;return}
  if(live&&!h.working)return;
  site.cs-=dt*bSpeed();
  if(site.cs<=0){site.cs=0;completeSite(site,live);h.atSite=null;
    if(!live&&h.cmd==='auto'){const n=nextSite();if(n){h.atSite=n.id;h.x=n.x+.5;h.y=n.y+1.05}}}

function updHero(dt){
  const h=S.hero;if(!h)return;h.anim=(h.anim||0)+dt;h.working=false;
  if(h.cmd==='gather'){updV(h,dt);if(!h.job)h.cmd='auto';return}
  if(h.cmd==='inv'){const m=h.inv;if(!m){h.cmd='auto';return}
    if(h.ph==='work'){h.working=true;h.wait-=dt;if(h.wait<=0){h.cmd='auto';h.inv=null;finishInv(m.id)}return}
    if(walk(h,m.x+.5,m.y+.85,dt)){const st=curStep();h.ph='work';h.wait=(st&&st.w)||6}return}
  if(h.cmd==='walk'){if(walk(h,h.tx,h.ty,dt)){h.cmd='auto';h.flag=null}return}
  if(h.cmd!=='auto')return;
  const site=nextSite();
  if(!site){h.atSite=null;return}
  if(h.atSite!==site.id)h.atSite=null;
  if(walk(h,site.x+.5,site.y+1.05,dt)){h.atSite=site.id;h.working=true}

const pendingBeds=()=>S.buildings.filter(b=>b.type==='house'&&isSite(b)).length*2;

const hasRoadAt=(x,y)=>[[1,0],[-1,0],[0,1],[0,-1]].some(([a,c])=>inMap(x+a,y+c)&&S.road[x+a+(y+c)*W]);
function freeSpot(){

  let best=null,bd=1e9;for(let y=Math.floor(cy)-10;y<=cy+10;y++)for(let x=Math.floor(cx)-10;x<=cx+10;x++){if(!inMap(x,y)||!validPlace(x,y)||(xmas&&xmas.x===x&&xmas.y===y))continue;const d=Math.hypot(x-cx,y-cy)+(hasRoadAt(x,y)?-1.5:0);if(d<bd){bd=d;best={x,y}}}
  return best;
}
function selfBuildTick(dt,live){

    if(hs.length<3){const idle=idleV().sort((a,c)=>Math.hypot(a.x-b.x,a.y-b.y)-Math.hypot(c.x-b.x,c.y-b.y));for(const v of idle.slice(0,3-hs.length)){v.job={t:'c',id:b.id};v.tx=null;v.atC=false}hs=S.vill.filter(v=>v.job&&v.job.t==='c'&&v.job.id===b.id)}

  }else S.emT=Math.min(S.emT,60);

function nearestDrop(x,y){let best=null,bd=1e9;for(const b of S.buildings)if(B[b.type].store&&!isSite(b)){const d=Math.hypot(b.x+fpW(b.type)/2-x,b.y+fpH(b.type)/2-y);if(d<bd){bd=d;best=b}}return best}
function tileCost(i){const t=S.tiles[i];if(t===WA)return Infinity;if(S.road[i])return .45;if(NODE[t])return S.amt[i]>0?2.2:1.2;return 1}
function findPath(sx,sy,gx,gy){
  if(!inMap(sx,sy)||!inMap(gx,gy))return null;
  const N=W*H,st=sx+sy*W,goal=gx+gy*W;if(st===goal)return [];
  const g=new Float32Array(N).fill(Infinity),came=new Int32Array(N).fill(-1),cl=new Uint8Array(N),hp=[];
  const hf=i=>{const dx=Math.abs(i%W-gx),dy=Math.abs(((i/W)|0)-gy);return (Math.max(dx,dy)+.414*Math.min(dx,dy))*.45};
  const push=(f,i)=>{hp.push([f,i]);let k=hp.length-1;while(k>0){const q=(k-1)>>1;if(hp[q][0]<=hp[k][0])break;[hp[q],hp[k]]=[hp[k],hp[q]];k=q}};
  const pop=()=>{const top=hp[0],l=hp.pop();if(hp.length){hp[0]=l;let k=0;for(;;){const a=2*k+1,b=a+1;let m=k;if(a<hp.length&&hp[a][0]<hp[m][0])m=a;if(b<hp.length&&hp[b][0]<hp[m][0])m=b;if(m===k)break;[hp[m],hp[k]]=[hp[k],hp[m]];k=m}}return top[1]};
  g[st]=0;push(hf(st),st);
  while(hp.length){
    const cur=pop();if(cur===goal)break;if(cl[cur])continue;cl[cur]=1;
    const cx=cur%W,cy=(cur/W)|0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(!inMap(nx,ny))continue;const ni=nx+ny*W;if(cl[ni])continue;
      let c=tileCost(ni);if(ni===goal&&c===Infinity)c=1;if(c===Infinity)continue;
      if(dx&&dy){if(S.tiles[cx+dx+cy*W]===WA||S.tiles[cx+(cy+dy)*W]===WA)continue;c*=1.414}
      const ng=g[cur]+c;if(ng<g[ni]){g[ni]=ng;came[ni]=cur;push(ng+hf(ni),ni)}

  }

function walk(v,tx,ty,dt,sp){

}
function moveTo(v,tx,ty,dt,sp){const dx=tx-v.x,dy=ty-v.y,d=Math.hypot(dx,dy);let s=(sp||v.spd||SPEED)*dt*(VEH?1.4:1)*(v.kid?.8:1);if(S.road[Math.floor(v.x)+Math.floor(v.y)*W])s*=1.8;if(d<=s){v.x=tx;v.y=ty;return true}v.x+=dx/d*s;v.y+=dy/d*s;return false}
function findAlt(x,y,t){let best=null,bd=1e9;for(let yy=y-6;yy<=y+6;yy++)for(let xx=x-6;xx<=x+6;xx++){if(!inMap(xx,yy))continue;const i=xx+yy*W;if(S.tiles[i]!==t||S.amt[i]<=0||!S.zones[zoneOf(xx,yy)])continue;const d=Math.hypot(xx-x,yy-y);if(d<bd){bd=d;best={x:xx,y:yy}}}return best}

function updV(v,dt){

    if(v.hosp){const b=byId(v.hosp);if(b){if(!v.inH&&walk(v,b.x+fpW(b.type)/2,b.y+fpH(b.type)/2+.2,dt,SPEED*.6))v.inH=true;v.asleep=false;return}v.hosp=null;v.inH=false}

    return}
  const j=v.job;

    if(isNight()&&v.role==='w'){v.asleep=false;
      if(v.tx==null){const bs=S.buildings.filter(b=>!isSite(b)),b=bs[Math.floor(Math.random()*bs.length)];v.tx=Math.max(.3,Math.min(W-.3,b.x+.5+(Math.random()-.5)*2));v.ty=Math.max(.3,Math.min(H-.3,b.y+1.1))}
      if(v.wait>0){v.wait-=dt;return}
      if(walk(v,v.tx,v.ty,dt,SPEED*.6)){v.tx=null;v.wait=1+Math.random()*2}
      return;
    }
    if(isNight()){
      let h=v.home&&byId(v.home);
      if(!h||!B[h.type].house){const hs=S.buildings.filter(b=>B[b.type].house);h=hs[Math.floor(Math.random()*hs.length)];v.home=h.id}
      if(!v.asleep&&walk(v,h.x+.5,h.y+.5,dt,SPEED*.8))v.asleep=true;
      return;
    }
    if(v.asleep){v.asleep=false;v.tx=null;v.wait=Math.random()*2}
    if(v.wait>0){v.wait-=dt;return}
    if(v.tx==null&&v.role==='s'){const hs=S.buildings.filter(b=>b.type==='house'&&!isSite(b));if(hs.length){const b=hs[Math.floor(Math.random()*hs.length)];v.tx=Math.max(.3,Math.min(W-.3,b.x+.5+(Math.random()-.5)*1.6));v.ty=Math.max(.3,Math.min(H-.3,b.y+1.15))}}
    if(v.tx==null&&!v.kid&&(v.role==='t'||festOn())){const st=v.role==='t'?S.buildings.find(b=>b.type==='stall'&&!isSite(b)):S.buildings[0];if(st){v.tx=Math.max(.3,Math.min(W-.3,st.x+.5+(Math.random()-.5)*2.6));v.ty=Math.max(.3,Math.min(H-.3,st.y+.5+(Math.random()-.5)*2.6))}}
    if(v.tx==null&&fairOn()&&!v.kid&&Math.random()<.6){const f=S.fair;v.tx=f.x+.3+Math.random()*(f.s-.6);v.ty=f.y+.3+Math.random()*(f.s-.6)}
    if(v.tx==null&&(seasonIdx()===3||seasonIdx()===1)&&Math.random()<.5){const ws=S.buildings.filter(b=>B[b.type].wjoy&&!isSite(b));if(ws.length){const st=ws[Math.floor(Math.random()*ws.length)];v.tx=Math.max(.3,Math.min(W-.3,st.x+.5+(Math.random()-.5)*1.8));v.ty=Math.max(.3,Math.min(H-.3,st.y+1.2))}}
    if(v.tx==null){const sc=v.kid&&v.seat&&S.buildings.find(b=>b.type==='school'&&!isSite(b)),hs=S.buildings.filter(b=>B[b.type].house&&!isSite(b)),hp=v.home&&byId(v.home),h=sc||(hp&&B[hp.type].house?hp:hs[Math.floor(Math.random()*hs.length)]);v.tx=Math.max(.3,Math.min(W-.3,h.x+.5+(Math.random()-.5)*3));v.ty=Math.max(.3,Math.min(H-.3,h.y+.5+(Math.random()-.5)*3))}
    if(walk(v,v.tx,v.ty,dt,SPEED*.5)){v.tx=null;v.wait=1+Math.random()*3}
    return;
  }
  if(j.t==='b'){
    const b=byId(j.id);if(!b){v.job=null;return}

    return;
  }
  if(j.t==='c'){const b=byId(j.id);if(!b||!(b.cs>0)){v.job=null;v.atC=false;return}const a=(v.id*2.3)%6.28;if(walk(v,b.x+.5+Math.cos(a)*.6,b.y+.5+Math.sin(a)*.6,dt)){v.atC=true;v.working=true}return}
  if(j.t==='h'){const b=byId(j.id);if(!b||!(b.cs>0)){v.job=null;v.atC=false;return}const a=(v.id*2.3)%6.28;if(walk(v,b.x+.5+Math.cos(a)*.6,b.y+.5+Math.sin(a)*.6,dt)){v.atC=true;v.working=true}return}

  if(j.t==='i'){
    if(v.ph==='work'){v.working=true;v.wait-=dt;if(v.wait<=0){v.job=null;v.tx=null;finishInv(j.id)}return}

}

function sendGather(x,y,all){
  const idle=idleV();

  idle.sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y));
  const n=all?idle.length:1;
  for(let k=0;k<n;k++){const v=idle[k];v.job={t:'g',x,y};v.ph='go';v.tx=null;v.wait=0}

function addWorker(b,quiet){
  if(isSite(b)){if(!quiet)toast('🚧 Noch im Bau');return false}

const ptrs=new Map();let buildQ=[],multiSel=false,serialMode=false,distMode=null,gm=null,GM_IGN=null,tapStart=null,pinch=null,sel=null,placing=null,demoMode=false,demoTarget=null,roadMode=null,pathGen=0;
function clampCam(){const vw=innerWidth/cam.z,vh=innerHeight/cam.z;cam.x=Math.max(-vw/2,Math.min(W*T-vw/2,cam.x));cam.y=Math.max(-vh/2,Math.min(H*T-vh/2,cam.y))}
function pinchStart(){const p=[...ptrs.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;pinch={d0:d,z0:cam.z,wx:cam.x+mx/cam.z,wy:cam.y+my/cam.z}}
cv.addEventListener('pointerdown',e=>{
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

  const p=ptrs.get(e.pointerId);if(!p)return;

  if(ptrs.size>=2&&pinch){
    const q=[...ptrs.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),mx=(q[0].x+q[1].x)/2,my=(q[0].y+q[1].y)/2;
    cam.z=Math.max(ZMIN,Math.min(ZMAX,pinch.z0*d/pinch.d0));cam.x=pinch.wx-mx/cam.z;cam.y=pinch.wy-my/cam.z;clampCam();
  }else if(ptrs.size===1){

  }
});
function pEnd(e,cancel){

  const x=i%W,yy=(i/W)|0;for(const v of S.vill)if(v.job&&v.job.t==='g'&&v.job.x===x&&v.job.y===yy){const a=findAlt(x,yy,t);if(a){v.job.x=a.x;v.job.y=a.y;if(v.ph!=='back')v.ph='go'}}

  let n=0,short=false;for(const [xx,yy] of line){if(!canRoad(xx,yy))continue;if(S.res.stone<1){short=true;break}S.res.stone-=1;S.road[xx+yy*W]=1;n++;dirtyAround(xx,yy)}

        toast(n?`🚧 ${n} Baustelle${n>1?'n':''} ${d.i} ${d.n} angelegt${n<sp.length?` (${sp.length-n} nicht möglich)`:''} – Bauhelfer packen mit an!`:'Nichts gebaut');save();break}
      if(!placing||placing.x==null)return;
      const d=B[placing.type];
      if(!validPlace(placing.x,placing.y))return;
      if(placing.move){const b=byId(placing.move);if(b){const ox=b.x,oy=b.y;b.x=placing.x;b.y=placing.y;dirtyAround(ox,oy);dirtyAround(b.x,b.y);toast(`↔️ ${d.n} verschoben`)}placing=null;updateBanner();save();break}
      if(!canPay(d.cost)){toast('Nicht genug Ressourcen');return}
      pay(d.cost);
      const bt=buildTime(d.cost),b={id:S.nid++,type:placing.type,x:placing.x,y:placing.y,level:1,t:Date.now(),cs:bt,ct:bt,qs:Date.now(),pc:Object.assign({},d.cost)};S.buildings.push(b);dirtyAround(b.x,b.y);
      const wasQ=placing.q;placing=null;
      if(wasQ){buildQ.shift();if(buildQ.length){if(canPay(B[buildQ[0]].cost)){const qi=wasQ.qn-buildQ.length+1;placing={type:buildQ[0],x:null,y:null,q:wasQ,qi,qn:wasQ.qn}}else{toast(`Nicht genug Ressourcen für ${B[buildQ[0]].i} ${B[buildQ[0]].n} – Rest der Auswahl abgebrochen`);buildQ=[]}}}
      updateBanner();
      if(S.hero&&S.hero.cmd!=='inv'){heroFree();S.hero.cmd='auto'}
      toast(`🚧 Baustelle ${d.i} ${d.n} – ${heroName().split(' ')[0]} baut (${Math.ceil(bt/bSpeed())} s)`);
      save();break}
    case 'wadd':{const b=byId(+p);if(b)addWorker(b);renderSheet();break}
    case 'wsub':{const b=byId(+p);if(b)subWorker(b);renderSheet();break}
    case 'up':{const b=byId(+p);if(!b||b.cs>0)return;const c=upCost(b);if(b.level>=maxLevel()||!canPay(c)){toast('Nicht genug Ressourcen');return}pay(c);const ut=upTime(c);b.cs=ut;b.ct=ut;b.up=1;b.uc=c;b.qs=Date.now();if(S.hero&&S.hero.cmd!=='inv'){heroFree();S.hero.cmd='auto'}toast(`🚧 Ausbau gestartet – ${heroName().split(' ')[0]} baut (${Math.ceil(ut/bSpeed())} s)`);renderSheet();save();break}
    case 'demo':{const b=byId(+p);if(!b)return;if(demoConfirm!==b.id){demoConfirm=b.id;renderSheet();return}
      doDemolish(b);demoConfirm=null;sel=null;closeSheet();break}
    case 'send1':sendGather(sheetArg.x,sheetArg.y,false);renderSheet();break;
    case 'sendall':sendGather(sheetArg.x,sheetArg.y,true);renderSheet();break;
    case 'recall':for(const v of S.vill)if(v.job&&v.job.t==='g'){if(v.carry){addRes(v.carry.r,v.carry.a);v.carry=null}v.job=null;v.tx=null}toast('Sammler kommen zurück');renderSheet();break;
    case 'unlock':{const z=+p,c=zoneCost();if(S.zones[z]||!zoneAdj(z)||!canPay(c)){toast('Nicht genug Ressourcen');return}pay(c);S.zones[z]=1;gainXP(100);drawAllTerrain();closeSheet();toast(`🔓 ${THEME_N[THEMES[z]]} freigeschaltet! Max. Ausbaustufe jetzt ${maxLevel()}`);checkGoals();save();break}
    case 'res':{const r=R[p];if(S.tech[p]||!canPay(r.cost))return;if(!gateOk(p)){toast('📖 Zuerst: '+gateTxt(p));return}if(r.edu&&eduCount()<r.edu){toast(`Benötigt ${r.edu} Gelehrte 🎓`);return}if(S.rs){toast('Es läuft bereits eine Forschung');return}pay(r.cost);S.rs={k:p,t:resTime(r),T:resTime(r)};toast(`🔬 Forschung „${r.n}“ gestartet (${Math.ceil(resTime(r)/resSpeed()/60)} Min.)`);renderSheet();save();break;gainXP(40);toast(`🔬 ${r.n} erforscht!`);renderSheet();checkGoals();save();break}
    case 'openb':{const b=byId(+p);if(b){sel={x:b.x,y:b.y};openSheet('b',b.id);centerOn(b.x,b.y)}break}
    case 'export':{const s=btoa(unescape(encodeURIComponent(serialize())));
      const done=()=>toast('📋 Spielstand kopiert');
      try{navigator.clipboard.writeText(s).then(done,()=>{$('imp').value=s;toast('Kopieren nicht möglich – Text steht im Feld unten')})}catch(e){$('imp').value=s;toast('Text steht im Feld unten – bitte manuell kopieren')}break}
    case 'import':{try{const o=JSON.parse(decodeURIComponent(escape(atob($('imp').value.trim()))));if(!valid(o))throw 0;adopt(o);drawAllTerrain();closeSheet();centerOn(21,21);toast('📥 Spielstand geladen');save();if(!S.hero)modal(heroPicker(false))}catch(e){toast('Ungültiger Spielstand')}break}
    case 'newgame':if(!newConfirm){newConfirm=true;renderSheet();return}newGame();drawAllTerrain();closeSheet();centerOn(21,21);save();modal(heroPicker(false));break;
    case 'vfree':{const v=S.vill.find(x=>x.id===+p);if(v){const b=v.job&&v.job.t==='b'&&byId(v.job.id);if(v.carry){addRes(v.carry.r,v.carry.a);v.carry=null}v.job=null;v.tx=null;if(b)reslot(b)}renderSheet();break}
    case 'openv':{const v=S.vill.find(x=>x.id===+p);if(v){openSheet('v',v.id);centerOn(Math.floor(v.x),Math.floor(v.y))}break}
    case 'dlg':if(dlgQ){dlgQ.shift();showDlg()}return;
    case 'sstart':{const c=curCh();if(!c||S.story.on||!reqMet(c.req))return;S.story.on=1;S.story.st=0;dialog(c.intro,()=>{storyTick();renderSheet()});renderSheet();save();break}
    case 'sreplay':{const c=STORY[+p];if(c)dialog(+p<S.story.ch?c.intro.concat(c.outro):c.intro);break}
    case 'sgive':{const st=curStep();if(!st||st.t!=='give'||!canPay(st.c)){toast('Nicht genug Ressourcen');return}pay(st.c);advanceStep();break}
    case 'sshow':{const st=curStep();if(st&&st.t==='inv'){const pp=markerPos(st);if(pp){closeSheet();centerOn(pp.x,pp.y);sel=pp}}break}
    case 'sinv':{const m=activeMarker();if(!m)return;const idle=idleV();if(!idle.length){toast('Kein freier Bewohner');return}idle.sort((a,b)=>Math.hypot(a.x-m.x,a.y-m.y)-Math.hypot(b.x-m.x,b.y-m.y));const v=idle[0];v.job={t:'i',id:m.st.id,x:m.x,y:m.y};v.ph='go';v.tx=null;toast(`🔍 ${v.name} macht sich auf den Weg`);renderSheet();break}
    case 'spage':dialog([['erz','📜 '+PAGES[+p]]]);break;
    case 'pick':{if(!HEROES[p])return;if(S.hero){S.hero.c=p;S.hero.name=HEROES[p].n}else makeHero(p);$('modal').classList.remove('on');toast(`${HEROES[p].i} Willkommen, ${HEROES[p].n}!`);save();break}
    case 'hero':openSheet('hero');break;
    case 'hchange':modal(heroPicker(true));break;
    case 'hbuild':if(S.hero){heroFree();S.hero.cmd='auto'}renderSheet();break;
    case 'hstop':if(S.hero){S.hero.cmd='stop';S.hero.atSite=null}renderSheet();break;
    case 'hshow':if(S.hero){closeSheet();centerOn(Math.floor(S.hero.x),Math.floor(S.hero.y))}break;
    case 'hfirst':{const b=byId(+p);if(b){let mn=Infinity;for(const x of S.buildings)if(x.cs>0)mn=Math.min(mn,x.qs||0);b.qs=mn-1;if(S.hero&&S.hero.cmd==='stop')S.hero.cmd='auto'}renderSheet();break}
    case 'ucancel':{const b=byId(+p);if(b&&b.up&&b.cs>0){if(b.uc)for(const r in b.uc)addRes(r,b.uc[r]);delete b.cs;delete b.ct;delete b.up;delete b.uc;delete b.qs;toast('Ausbau abgebrochen – alles zurück');save()}renderSheet();break}
    case 'hgather':{const h=S.hero;if(!h)return;heroFree();h.cmd='gather';h.job={t:'g',x:sheetArg.x,y:sheetArg.y};h.ph='go';closeSheet();toast(`${HEROES[h.c].i} ${heroName().split(' ')[0]} geht sammeln`);break}
    case 'hinv':{const m=activeMarker();if(!m||!S.hero)return;heroFree();const h=S.hero;h.cmd='inv';h.inv={id:m.st.id,x:m.x,y:m.y};h.ph='go';closeSheet();toast(`🔍 ${heroName().split(' ')[0]} macht sich auf den Weg`);break}
    case 'rcancel':{if(!S.rs)return;const r=R[S.rs.k];for(const x in r.cost)addRes(x,r.cost[x]);S.rs=null;toast('Forschung abgebrochen – alles zurück');renderSheet();break}
    case 'tax':S.taxR=TAX[+p].g;renderSheet();break;
    case 'selfb':S.selfBuild=S.selfBuild===false;toast(S.selfBuild?'🏠 Bewohner bauen jetzt selbst Häuser':'Selbstbau ausgeschaltet');renderSheet();break;
    case 'trade':openSheet('trade');break;
    case 'bank':openSheet('bank');break;
    case 'bamt':bankAmt=p==='all'?'all':+p;renderSheet();break;
    case 'bdep':{const k=S.bank;if(k.loan>0)return;const n=bAmt(Math.min(S.res.gold,bankCap()-bankUsed()));if(n<1){toast('Limit erreicht oder kein Gold');return}S.res.gold-=n;k.sav+=n;toast(`🏦 ${n} Gold eingezahlt`);renderSheet();checkGoals();save();break}
    case 'bwd':{const k=S.bank,n=bankAmt==='all'?k.sav:Math.min(bankAmt,k.sav);if(n<=0)return;k.sav-=n;if(k.sav<.01)k.sav=0;S.res.gold+=n;toast(`🏦 ${fmt(n)} Gold abgehoben`);renderSheet();save();break}
    case 'bfix':{const k=S.bank,d=+p;if(k.loan>0)return;const n=bAmt(Math.min(S.res.gold,bankCap()-bankUsed()));if(n<1){toast('Limit erreicht oder kein Gold');return}S.res.gold-=n;k.fixed.push({amt:n,rate:FIX[d],until:S.gt+d*DAY});toast(`🔒 ${n} Gold fest angelegt (+${Math.round(FIX[d]*100)} %)`);renderSheet();checkGoals();save();break}
    case 'bbreak':{const k=S.bank,f=k.fixed[+p];if(!f)return;k.fixed.splice(+p,1);k.sav+=f.amt;toast('Festgeld aufgelöst – ohne Zinsen aufs Sparkonto');renderSheet();save();break}
    case 'bloan':{const k=S.bank;if(k.loan>0)return;const n=bAmt(loanMax());if(n<1)return;S.res.gold+=n;k.loan=n*1.05;toast(`📜 Kredit: +${n} Gold (Schuld ${fmt(k.loan)})`);renderSheet();save();break}
    case 'brepay':{const k=S.bank,n=Math.min(bankAmt==='all'?k.loan:bankAmt,S.res.gold,k.loan);if(n<=0)return;S.res.gold-=n;k.loan-=n;if(k.loan<.5){S.res.gold=Math.max(0,S.res.gold-k.loan);k.loan=0;toast('✅ Kredit vollständig getilgt!')}else toast(`📜 ${fmt(n)} Gold getilgt`);renderSheet();save();break}
    case 'sell':{const [r,n]=p.split(':');doSell(r,+n);renderSheet();checkGoals();break}
    case 'buy':{const [r,n]=p.split(':');doBuy(r,+n);renderSheet();break}
    case 'toffer':{const t=S.trader,o=t&&t.offers[+p];if(!o||o.done)return;
      if(o.k==='buy'){if(S.res[o.r]<o.n)return;S.res[o.r]-=o.n;GSRC='🧳 Fahrender Händler';earn(o.g);GSRC=null}
      else{if(S.res.gold<o.g)return;S.res.gold-=o.g;if(o.k==='sell')addRes(o.r,o.n);else addRes('research',o.n)}
      o.done=1;toast('🤝 Handel abgeschlossen!');renderSheet();checkGoals();save();break}
    case 'dsite':{const b=byId(+p);if(!b||!(b.cs>0))return;const c=dCost(b.self?b.cs/(.5*Math.max(1,S.vill.filter(v=>v.job&&v.job.t==='c'&&v.job.id===b.id).length)):b.cs/bSpeed());if(S.res.diamond<c){toast('Nicht genug Diamanten 💎');return}S.res.diamond-=c;b.cs=0;if(b.self)for(const v of S.vill)if(v.job&&v.job.t==='c'&&v.job.id===b.id){v.job=null;v.tx=null;v.atC=false}if(S.hero&&S.hero.atSite===b.id)S.hero.atSite=null;completeSite(b,true);toast(`💎 −${c} Diamanten: sofort fertig!`);renderSheet();break}
    case 'dres':{if(!S.rs)return;const c=dCost(S.rs.t/resSpeed());if(S.res.diamond<c){toast('Nicht genug Diamanten 💎');return}S.res.diamond-=c;S.rs.t=0.001;tick(0.01,true);toast(`💎 −${c} Diamanten: Forschung abgeschlossen!`);renderSheet();save();break}
    case 'bye':{const n=+p;const fr=freeV().sort((a,c)=>(a.partner?1:0)-(c.partner?1:0));if(fr.length<n){toast('Nicht genug freie Bewohner');return}
      for(const v of fr.slice(0,n))leaveV(v,false);toast(`👋 ${n} Bewohner ${n>1?'sind':'ist'} freundlich weitergezogen.`);renderSheet();save();break}
    case 'fwshow':closeSheet();startFireworks(true);break;
    case 'gofair':if(fairOn()){closeSheet();centerOn(S.fair.x+S.fair.s/2,S.fair.y+S.fair.s/2);toast(`🎡 Kirmes: +30 % Freude, noch ${Math.ceil((S.fair.until-S.gt)/60)} Min.`)}break;
    case 'fairinv':{if(fairOn()||S.res.gold<FAIR_COST||seasonIdx()===3)return;if(startFair(true,true)){S.res.gold-=FAIR_COST;closeSheet()}break}
    case 'epup':epochUp();break;
    case 'radd':{if(!S.routes)S.routes=[];if(S.routes.length>=routeMax())return;S.routes.push({v:'muehl',out:'planks',n:Math.min(30,routeCap()),back:'',on:false,st:'home',t:0});renderSheet();save();break}
    case 'rdel':{const rt=S.routes[+p];if(rt&&rt.st==='home'){S.routes.splice(+p,1);renderSheet();save()}break}
    case 'rtog':{const rt=S.routes[+p];if(rt){rt.on=!rt.on;renderSheet();save()}break}
    case 'rn':{const [i,dn]=p.split(':');const rt=S.routes[+i];if(rt){rt.n=Math.max(10,Math.min(routeCap(),Math.min(rt.n,routeCap())+ +dn));renderSheet();save()}break}
    case 'rquiet':S.routeQuiet=!S.routeQuiet;renderSheet();break;
    case 'dist':distMode={k:1,br:3};placing=null;gm=null;roadMode=null;demoMode=false;closeSheet();sel=null;updateBanner();break;
    case 'dpick':if(distMode){distMode.k=+p;updateBanner()}break;
    case 'dbrush':if(distMode){distMode.br=distMode.br===3?1:3;updateBanner()}break;
    case 'dshow':S.showDist=!S.showDist;renderSheet();break;
    case 'sertog':serialMode=!serialMode;if(serialMode&&multiSel){multiSel=false;buildQ=[]}renderSheet();break;
    case 'msel':multiSel=!multiSel;if(multiSel)serialMode=false;if(!multiSel)buildQ=[];renderSheet();break;
    case 'qadd':{buildQ.push(p);renderSheet();break}
    case 'qrem':{const i=buildQ.lastIndexOf(p);if(i>=0)buildQ.splice(i,1);renderSheet();break}
    case 'qclr':buildQ=[];renderSheet();break;
    case 'qstart':{if(!buildQ.length)return;if(!canPay(B[buildQ[0]].cost)){toast('Nicht genug Ressourcen');return}const q={qn:buildQ.length};placing={type:buildQ[0],x:null,y:null,q,qi:1,qn:buildQ.length};roadMode=null;demoMode=false;closeSheet();sel=null;updateBanner();break}
    case 'gmove':gm={ids:[],st:'sel',x:null,y:null};placing=null;roadMode=null;demoMode=false;closeSheet();sel=null;updateBanner();break;
    case 'advtog':S.advOff=!S.advOff;renderSheet();break;
    case 'ob':{const b=byId(+p);if(!b)return;centerOn(b.x+.5,b.y+.5);openSheet('b',b.id);break}
    case 'rdone':S.showDone=!S.showDone;renderSheet();break;
    case 'itog':{const I=idleCfg();if(p==='sweep')I.sweep=I.sweep===false;else I[p]=!I[p];if(p==='trade'&&I.trade&&!has('stall'))toast('Baue zuerst einen 🏪 Händlerstand');renderSheet();save();break}
    case 'fest':{const fc=festCost();if(festOn()||(S.festCD||0)>S.gt||freeV().length<5||!canPay(fc)){toast('Fest gerade nicht möglich');return}pay(fc);S.fest=S.gt+FEST_T;S.festCD=S.gt+FEST_CD;for(const v of freeV())v.tx=null;gainXP(30);toast('🎉 Das Dorffest beginnt! Alle feiern am Lagerfeuer.');renderSheet();save();break}
    case 'explore':{const fr=freeV();if(!fr.length||S.res.food<15||S.vill.filter(v=>v.job&&v.job.t==='x').length>=EXP_MAX){toast('Gerade kein Erkunder verfügbar');return}const v=fr[Math.floor(Math.random()*fr.length)];S.res.food-=15;v.job={t:'x',until:S.gt+EXP_T};v.tx=null;v.role=null;toast(`🗺️ ${v.name} zieht los, um die Gegend zu erkunden!`);renderSheet();save();break}
    case 'mclose':$('modal').classList.remove('on');break;
  }
  updateUI();
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!el.dataset.act||el.disabled)return;const s=el.dataset.act,k=s.indexOf(':');act(k<0?s:s.slice(0,k),k<0?null:s.slice(k+1))});
$('goal').addEventListener('click',()=>$('goal').classList.toggle('min'));
document.addEventListener('input',e=>{if(e.target.id==='popr'){taxDrag=true;const v=+e.target.value;S.popMax=v>=+e.target.max?null:v;const el=$('popinfo');if(el)el.innerHTML=popInfo();return}if(e.target.id!=='taxr')return;taxDrag=true;S.taxR=Math.round(+e.target.value*10)/10;const el=$('taxinfo');if(el)el.innerHTML=taxInfo();{const m=$('moodl'),t=happy().total;if(m)m.innerHTML=`<b>${moodI(t)} Zufriedenheit ${Math.round(t*100)} %</b> → Produktion ×${f1(.8+.4*t)}`}updateUI()});
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.chg;if(c){const [k,i]=c.split(':'),rt=S.routes&&S.routes[+i];if(!rt)return;const val=e.target.value;if(k==='rv'){rt.v=val;const v=vilById(val);if(rt.back&&!v.offer[rt.back])rt.back=''}if(k==='ro')rt.out=val;if(k==='rb')rt.back=val;renderSheet();save();return}if(e.target.id==='popr'){taxDrag=false;toast(S.popMax==null?'🚪 Zuzug: unbegrenzt':`🚪 Höchstens ${S.popMax} Einwohner`);save();renderSheet();return}if(e.target.id!=='taxr')return;taxDrag=false;S.taxR=Math.round(+e.target.value*10)/10;toast(`💰 Steuersatz: ${f1(S.taxR)} Gold pro Kopf`);save();renderSheet()});
document.addEventListener('pointerdown',e=>{if(e.target.id==='taxr'||e.target.id==='popr')taxDrag=true});
document.addEventListener('pointerup',()=>{if(taxDrag){setTimeout(()=>{if(document.activeElement&&(document.activeElement.id==='taxr'||document.activeElement.id==='popr'))document.activeElement.blur();taxDrag=false},300)}});

// ======================= START =======================
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;document.documentElement.style.setProperty('--navh',$('nav').offsetHeight+'px');clampCam()}
function centerOn(x,y){cam.x=(x+.5)*T-innerWidth/2/cam.z;cam.y=(y+.5)*T-innerHeight/2/cam.z;clampCam()}
addEventListener('resize',()=>{resize();initWx()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{catchUp(true);last=performance.now()}});
addEventListener('pagehide',save);

if(!load())newGame();
setupTerrain();lastSea=seasonIdx();initWx();
cam.z=Math.max(ZMIN,Math.min(ZMAX,innerWidth/(11*T)));
resize();centerOn(21,21);
catchUp(!!S.hero);
if(!S.hero)modal(heroPicker(false));
checkGoals();lastLv=lvInfo().L;updateUI();
let last=performance.now(),acc=0,uiAcc=0,saveAcc=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  acc+=dt;uiAcc+=dt;saveAcc+=dt;
  while(acc>=.25){tick(.25,true);acc-=.25}
  for(const v of S.vill)updV(v,dt);
  updHero(dt);
  for(const f of floats)f.a+=dt;floats=floats.filter(f=>f.a<1.5);
  lifeUpdate(dt);
  if(uiAcc>=.5){uiAcc=0;updateUI();if(sheetKind&&sheetKind!=='menu'&&sheetKind!=='build')renderSheet();if(placing)updateBanner()}
  if(saveAcc>=10){saveAcc=0;save()}
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
